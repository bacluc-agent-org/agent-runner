name: Check model availability
description: >-
  Probes whitelisted models for availability and merges the results into the
  model-availability cache issue in the issue repository. The cache issue
  number is taken from the MODEL_AVAILABILITY_CACHE_ISSUE env var, or
  auto-detected by searching for an issue titled "model-discovery cache" in
  the repository set via ISSUE_REPOSITORY. Available models cache for 24
  hours, failed models for 1 hour. Probes at most 30 stale candidates per
  run, highest priority first. Provider credentials are resolved from raw
  OpenCode config files plus the job environment; configured providers whose
  {env:...} refs do not resolve are skipped.
outputs:
  cache-issue:
    description: Resolved model-availability cache issue number (empty when none)
    value: ${{ steps.check.outputs.cache-issue }}
  cache-json:
    description: Merged cache JSON (current cache plus fresh probe results)
    value: ${{ steps.check.outputs.cache-json }}
  available-models:
    description: >-
      Newline-separated model IDs with ok=true in the merged cache that are
      credential-eligible: credentials are resolved from raw OpenCode config
      files plus the job environment, and configured providers whose {env:...}
      refs do not resolve are skipped. Listed in discovery order.
    value: ${{ steps.check.outputs.available-models }}
runs:
  using: composite
  steps:
    - name: Check model availability
      id: check
      shell: bash
      run: |
        set -Eeuo pipefail
        umask 077
        printf '::add-mask::%s\n' "${OPENCODE_GO_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENCODE_GO_2_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENROUTER_API_KEY:-}"
        python3 "${{ github.action_path }}/model_availability.py"
