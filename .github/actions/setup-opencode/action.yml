name: Set up OpenCode
description: >-
  Installs the OpenCode CLI and prepares the shared OpenCode configuration
  from the provision-machines repository, refreshes ChatGPT OAuth outside
  OpenCode, and routes OpenAI requests through a per-job AISIX proxy.
runs:
  using: composite
  steps:
    - name: Install GitHub CLI wrapper
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../../../scripts/install-gh-cli-wrapper.sh"

    - name: Install OpenCode
      shell: bash
      run: npm install --global @opencode/cli@2.2.5

    - name: Fetch and prepare OpenCode configuration
      id: config
      shell: bash
      env:
        SOURCE_REPOSITORY: https://github.com/bacluc/provision-machines.git
        CONFIG_PATH: deploys/development_tools/ai_agent_devcontainer/files/opencode
        SKILLS_PATH: deploys/development_tools/ai_agent_devcontainer/files/claude/skills
      run: |
        set -Eeuo pipefail

        printf '::add-mask::%s\n' "$GITHUB_TOKEN"
        printf '::add-mask::%s\n' "${OPENCODE_GO_API_KEY:-}"
        printf '::add-mask::%s\n' "${OPENCODE_GO_2_API_KEY:-}"
        printf '::add-mask::%s\n' "${BRAVE_API_KEY:-}"
        source_dir="$RUNNER_TEMP/provision-machines"
        config_dir="$RUNNER_TEMP/opencode-config"
        source_resolved=0
        if [[ -n "${SOURCE_BRANCH:-}" ]]; then
          branch_rc=0
          branch_line="$(git ls-remote --exit-code --heads "$SOURCE_REPOSITORY" "$SOURCE_BRANCH")" || branch_rc=$?
          if ((branch_rc == 0)); then
            branch_sha="${branch_line%%$'\t'*}"
            git clone --quiet --branch "$SOURCE_BRANCH" "$SOURCE_REPOSITORY" "$source_dir"
            cloned_branch_sha="$(git -C "$source_dir" rev-parse --verify "refs/heads/$SOURCE_BRANCH^{commit}" 2>/dev/null || true)"
            if [[ "$cloned_branch_sha" != "$branch_sha" ]]; then
              printf 'Source config branch changed while cloning: expected %s, got %s\n' "$branch_sha" "${cloned_branch_sha:-unresolved}" >&2
              exit 1
            fi
            git -C "$source_dir" checkout --quiet --detach "$branch_sha"
            printf 'Using source config BRANCH: %s (commit %s, resolution: resolved)\n' "$SOURCE_BRANCH" "$branch_sha"
            source_resolved=1
          else
            printf '::error::could not resolve SOURCE_BRANCH %s in %s (exit %s); the ref may be transient — it may have just been deleted or renamed\n' "$SOURCE_BRANCH" "$SOURCE_REPOSITORY" "$branch_rc"
            git ls-remote --heads "$SOURCE_REPOSITORY" 2>&1 | tail -n 20 || true
            printf 'SOURCE_BRANCH resolution: unresolved (exit %s); fell back to tag\n' "$branch_rc"
          fi
        fi
        # The tag path below keeps its original indentation on purpose: bash
        # ignores leading whitespace, so this fix stays a pure addition.
        if ((source_resolved == 0)); then
        mapfile -t tags < <(git ls-remote --tags "$SOURCE_REPOSITORY" \
          | awk '$2 !~ /\^\{\}$/ { sub("refs/tags/", "", $2); print $2 }' \
          | grep -E '^[vV]?[0-9]+([.][0-9]+){1,2}([-.][0-9A-Za-z.-]+)?$' \
          | sort -V)

        if ((${#tags[@]} == 0)); then
          printf '%s\n' 'No semver tags found in the source repository' >&2
          exit 1
        fi

        tag="${tags[${#tags[@]}-1]}"
        tag_refs="$(git ls-remote --tags "$SOURCE_REPOSITORY" "refs/tags/$tag" "refs/tags/$tag^{}")"
        tag_sha="$(printf '%s\n' "$tag_refs" | awk -v tag="$tag" \
          '$2 == "refs/tags/" tag "^{}" { peeled=$1 } $2 == "refs/tags/" tag { direct=$1 } END { print peeled ? peeled : direct }')"
        if [[ ! "$tag_sha" =~ ^[0-9a-f]{40}$ ]]; then
          printf 'Unable to resolve source config tag to a commit: %s\n' "$tag" >&2
          exit 1
        fi
        printf 'Using source config tag: %s (commit %s)\n' "$tag" "$tag_sha"
        git clone --quiet "$SOURCE_REPOSITORY" "$source_dir"
        cloned_tag_sha="$(git -C "$source_dir" rev-parse --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
        if [[ "$cloned_tag_sha" != "$tag_sha" ]]; then
          printf 'Source config tag changed while cloning: expected %s, got %s\n' "$tag_sha" "${cloned_tag_sha:-unresolved}" >&2
          exit 1
        fi
        git -C "$source_dir" checkout --quiet --detach "$tag_sha"
        fi
        if [[ ! -d "$source_dir/$CONFIG_PATH" ]]; then
          printf 'Missing OpenCode configuration directory: %s\n' "$CONFIG_PATH" >&2
          exit 1
        fi
        rm -rf "$config_dir"
        cp -a "$source_dir/$CONFIG_PATH" "$config_dir"

        if [[ ! -d "$source_dir/$SKILLS_PATH" ]]; then
          printf 'Missing skills directory: %s\n' "$SKILLS_PATH" >&2
          exit 1
        fi
        if [[ -z "$(compgen -G "$source_dir/$SKILLS_PATH/*/SKILL.md" 2>/dev/null)" ]]; then
          printf 'No SKILL.md files found in skills directory: %s\n' "$SKILLS_PATH" >&2
          exit 1
        fi
        cp -a "$source_dir/$SKILLS_PATH" "$config_dir/skills"
        printf 'Copied skills: %s\n' "$(ls "$config_dir/skills" | tr '\n' ' ')"

        [[ -f "$config_dir/agents/model-discovery.md" ]] || { echo "Missing model-discovery agent file"; exit 1; }

        mkdir -p "$HOME/.config"
        rm -rf "$HOME/.config/opencode"
        cp -a "$config_dir" "$HOME/.config/opencode"

    - name: Refresh OpenAI OAuth and start AISIX
      shell: bash
      run: |
        set -Eeuo pipefail
        umask 077
        printf '::add-mask::%s\n' "${OPENAI_ACCESS_TOKEN:-}"
        printf '::add-mask::%s\n' "${OPENAI_REFRESH_TOKEN:-}"
        printf '::add-mask::%s\n' "${OPENCODE_AUTH_CONTENT:-}"
        if [[ -z "${OPENAI_REFRESH_TOKEN:-}" && -z "${OPENCODE_AUTH_CONTENT:-}" ]]; then
          printf '::error::Set CHATGPT_REFRESH_TOKEN and CHATGPT_ACCESS_TOKEN, or keep OPENCODE_AUTH_JSON for one-time migration.\n' >&2
          exit 1
        fi
        OPENAI_REFRESH_TOKEN="${OPENAI_REFRESH_TOKEN:-}" python3 scripts/refresh-token.py > "$RUNNER_TEMP/chatgpt-oauth.json"
        jq -e '.access_token != "" and .refresh_token != "" and (.expires_at | type == "number")' "$RUNNER_TEMP/chatgpt-oauth.json" >/dev/null
        OPENAI_ACCESS_TOKEN="$(jq -r '.access_token' "$RUNNER_TEMP/chatgpt-oauth.json")"
        OPENAI_REFRESH_TOKEN="$(jq -r '.refresh_token' "$RUNNER_TEMP/chatgpt-oauth.json")"
        AISIX_CALLER_KEY="$(openssl rand -hex 32)"
        printf '::add-mask::%s\n' "$OPENAI_ACCESS_TOKEN"
        printf '::add-mask::%s\n' "$OPENAI_REFRESH_TOKEN"
        printf '::add-mask::%s\n' "$AISIX_CALLER_KEY"
        export OPENAI_ACCESS_TOKEN OPENAI_REFRESH_TOKEN AISIX_CALLER_KEY
        printf '%s' "$OPENAI_ACCESS_TOKEN" > "$RUNNER_TEMP/chatgpt-access-token"
        chmod 600 "$RUNNER_TEMP/chatgpt-access-token"
        python3 scripts/aisix_oauth.py
        AISIX_DIR="$RUNNER_TEMP/aisix-oauth"
        AISIX_IMAGE=ghcr.io/api7/aisix:1.8.0
        docker pull "$AISIX_IMAGE" >/dev/null
        docker run --rm --user "$(id -u):$(id -g)" --entrypoint aisix \
          -v "$AISIX_DIR/config.yaml:/etc/aisix/config.yaml:ro" \
          -v "$AISIX_DIR/resources.yaml:/etc/aisix/resources.yaml:ro" \
          -e AISIX_CALLER_KEY \
          "$AISIX_IMAGE" validate --resources /etc/aisix/resources.yaml
        docker run --detach --rm --user "$(id -u):$(id -g)" --name aisix-oauth-proxy \
          -v "$AISIX_DIR/config.yaml:/etc/aisix/config.yaml:ro" \
          -v "$AISIX_DIR/resources.yaml:/etc/aisix/resources.yaml:ro" \
          -e AISIX_CALLER_KEY \
          -p 127.0.0.1:3000:3000 \
          "$AISIX_IMAGE" >/dev/null
        for attempt in $(seq 1 30); do
          if curl --silent --fail --max-time 2 \
            -H "Authorization: Bearer $AISIX_CALLER_KEY" \
            http://127.0.0.1:3000/v1/models >/dev/null; then
            break
          fi
          if ((attempt == 30)); then
            printf '::error::AISIX did not become ready\n' >&2
            exit 1
          fi
          sleep 1
        done
        github_token="${BACLUC_AGENT_GITHUB_TOKEN:-$GITHUB_TOKEN}"
        printf '%s' "$OPENAI_ACCESS_TOKEN" | GH_TOKEN="$github_token" gh secret set CHATGPT_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY"
        printf '%s' "$OPENAI_REFRESH_TOKEN" | GH_TOKEN="$github_token" gh secret set CHATGPT_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
        rm -f "$AISIX_DIR/config.yaml" "$AISIX_DIR/resources.yaml" "$RUNNER_TEMP/chatgpt-oauth.json"
        {
          printf 'OPENAI_ACCESS_TOKEN=\n'
          printf 'OPENAI_REFRESH_TOKEN=\n'
          printf 'OPENCODE_AUTH_CONTENT=\n'
          printf 'OPENAI_ACCESS_TOKEN_FILE=%s\n' "$RUNNER_TEMP/chatgpt-access-token"
          printf 'AISIX_CALLER_KEY=%s\n' "$AISIX_CALLER_KEY"
          printf 'AISIX_PROXY_URL=http://127.0.0.1:3000/v1\n'
          printf 'OPENCODE_CONFIG_CONTENT=%s\n' "$(jq -cn --arg key "$AISIX_CALLER_KEY" '{provider:{openai:{options:{baseURL:"http://127.0.0.1:3000/v1",apiKey:$key}}}}')"
        } >> "$GITHUB_ENV"
        printf 'OpenAI OAuth is refreshed and routed through AISIX\n'
