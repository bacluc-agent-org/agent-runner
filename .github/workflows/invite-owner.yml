name: Invite owner to repositories

on:
  push:
    paths:
      - ".github/workflows/invite-owner.yml"
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      INVITE_USER: ${{ vars.FORK_INVITE_USER }}
    steps:
      - name: Sweep repositories for the owner collaborator invitation
        run: |
          set -Eeuo pipefail
          if [ -z "$INVITE_USER" ]; then
            echo "invite-sweep: skip (FORK_INVITE_USER unset)"
            exit 0
          fi
          repositories=0
          invited=0
          while read -r repository; do
            repositories=$((repositories + 1))
            if gh api "repos/${repository}/collaborators/${INVITE_USER}" --silent > /dev/null 2>&1; then
              echo "ok: ${repository}"
            else
              if gh api \
                "repos/${repository}/collaborators/${INVITE_USER}" \
                -X PUT \
                -f permission=push \
                > /dev/null 2>&1; then
                invited=$((invited + 1))
                echo "invited: ${repository}"
              else
                echo "WARNING: invite failed for ${repository}"
              fi
            fi
          done < <(
            gh api \
              "user/repos?type=owner&per_page=100&sort=full_name" \
              --paginate \
              --jq '.[].full_name'
          )
          echo "checked ${repositories} repositories, invited ${invited}"
