name: Refine issues

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refine-issues.yml"
      - ".github/actions/**"
      - ".opencode/**"
      - "scripts/**"

permissions:
  contents: read
  issues: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_2_API_KEY: ${{ secrets.OPENCODE_GO_2_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
      ISSUE_REPOSITORY: ${{ vars.ISSUE_REPOSITORY || github.repository }}
      MODEL_AVAILABILITY_CACHE_ISSUE: ${{ vars.MODEL_AVAILABILITY_CACHE_ISSUE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Set up OpenCode
        uses: ./.github/actions/setup-opencode

      - name: Check model availability
        id: model-availability
        timeout-minutes: 10
        uses: ./.github/actions/model-availability

      - name: Refine issues
        id: refine
        timeout-minutes: 22
        shell: bash
        env:
          AVAILABLE_MODELS: ${{ steps.model-availability.outputs.available-models }}
        run: |
          set -Eeuo pipefail

          printf '::add-mask::%s\n' "$GITHUB_TOKEN"
          printf '::add-mask::%s\n' "$OPENCODE_GO_API_KEY"
          printf '::add-mask::%s\n' "$OPENCODE_GO_2_API_KEY"
          printf '::add-mask::%s\n' "$OPENCODE_AUTH_CONTENT"

          printf '::group::ensure agent labels\n'
          if ! gh label create agent-refined -R "$ISSUE_REPOSITORY" \
            --color 1D76DB --description 'Refined by the issue-refiner agent' --force; then
            printf '::warning::could not ensure the agent-refined label exists; the label may not be applied\n'
          fi
          if ! gh label create ready-for-implementation -R "$ISSUE_REPOSITORY" \
            --color 0E8A16 --description 'Approved for agent implementation' --force; then
            printf '::warning::could not ensure the ready-for-implementation label exists; the label may not be applied\n'
          fi
          printf '::endgroup::\n'

          printf '\n\n\n\n\n\n'
          printf 'Fetching github issues...\n'
          printf '\n\n\n\n\n\n'

          candidates="$RUNNER_TEMP/candidate-numbers.txt"
          unrefined_json="$RUNNER_TEMP/unrefined-candidates.json"
          refined_json="$RUNNER_TEMP/refined-candidates.json"
          gh api "search/issues?q=repo:${ISSUE_REPOSITORY}+is:open+is:issue+-label:agent-refined+-label:ready-for-implementation+-label:agent-ignore+sort:created-asc&per_page=5" \
            --jq '.items' > "$unrefined_json"
          gh api "search/issues?q=repo:${ISSUE_REPOSITORY}+is:open+is:issue+label:agent-refined+-label:ready-for-implementation+-label:agent-ignore+sort:updated-desc&per_page=10" \
            --jq '.items' > "$refined_json"
          jq -r '.[].number | tostring' "$unrefined_json" > "$candidates"
          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            grep -Fxq "$number" "$candidates" && continue
            comments="$RUNNER_TEMP/comments-${number}.txt"
            gh api --paginate --slurp "repos/$ISSUE_REPOSITORY/issues/$number/comments?per_page=100" > "$RUNNER_TEMP/all-comments-${number}.json"
            jq 'add | map(select(.user.type != "Bot") | select((.body // "") | contains("<!-- agent-progress -->") | not))' "$RUNNER_TEMP/all-comments-${number}.json" > "$comments"
            refined_at="$(gh issue view "$number" -R "$ISSUE_REPOSITORY" --json body,updatedAt --jq 'if (.body | test("<!-- agent-refined: [^ ]+ -->")) then (.body | capture("<!-- agent-refined: (?<timestamp>[^ ]+) -->").timestamp) else .updatedAt end')"
            jq --arg refined_at "$refined_at" 'map(select(.created_at > $refined_at))' "$comments" > "$RUNNER_TEMP/new-comments-${number}.json"
            if [[ "$(jq 'length' "$RUNNER_TEMP/new-comments-${number}.json")" -gt 0 ]]; then
              mv "$RUNNER_TEMP/new-comments-${number}.json" "$comments"
              printf '%s\n' "$number" >> "$candidates"
            fi
          done < <(jq -r '.[].number | tostring' "$refined_json")
          if [[ ! -s "$candidates" ]]; then
            printf '%s\n' 'No unrefined open issues; nothing to do.'
            exit 0
          fi
          printf 'Actionable candidate issues (oldest unrefined, then recently updated):\n'
          cat "$candidates"
          printf '\n\n\n\n\n\n'
          printf 'Selecting model...\n'
          printf '\n\n\n\n\n\n'

          available_models_file="$RUNNER_TEMP/available-models.txt"
          printf '%s\n' "$AVAILABLE_MODELS" > "$available_models_file"

          selection_model=''
          selection_source=''
          # Exclude known-weak free models per scripts/model-deny-list.txt (shared with
          # hourly-issue.yml and opencode.yml); they pass the trivial OK probe but
          # fail as coordinator/selector in 10+ runs (e.g. 34029380869, 34042660858).
          mapfile -t free_models < <(grep -E '^(opencode|openrouter)/[^[:space:]]+(-free|:free)$' "$available_models_file" | grep -Ev -f scripts/model-deny-list.txt | awk '!seen[$0]++')
          for candidate in \
            'opencode-go-openai/qwen3.8-flash' \
            'opencode-go-openai-2/qwen3.8-flash' \
            'opencode/big-pickle' \
            "${free_models[@]}"; do
            case "$candidate" in
              opencode-go-openai/qwen3.8-flash)
                grep -Fxq "$candidate" "$available_models_file" && [[ -n "$OPENCODE_GO_API_KEY" ]] || continue
                ;;
              opencode-go-openai-2/qwen3.8-flash)
                grep -Fxq "$candidate" "$available_models_file" && [[ -n "$OPENCODE_GO_2_API_KEY" ]] || continue
                ;;
              opencode/big-pickle)
                grep -Fxq "$candidate" "$available_models_file" || continue
                ;;
              opencode/*-free) ;;
              openrouter/*)
                [[ -n "$OPENROUTER_API_KEY" ]] || continue
                ;;
              *) continue ;;
            esac
            selection_model="$candidate"
            selection_source='preferred list'
            break
          done
          if [[ -z "$selection_model" ]]; then
            selection_model="$(grep -Ev -f scripts/model-deny-list.txt "$available_models_file" | head -n1 || true)"
            selection_source='last resort (deny-list filtered)'
            if [[ -z "$selection_model" ]]; then
              printf '%s\n' 'No refinement model is available; not dispatching.' >&2
              exit 1
            fi
            printf '%s\n' "Using fallback model: $selection_model" >&2
          fi
          printf 'Refinement model: %s (source: %s)\n' "$selection_model" "$selection_source"
          printf '\n\n\n\n\n\n'

          refined=0
          failed=0
          max_attempts=2
          SECONDS=0

          while IFS= read -r number; do
            printf '\n=== Refining issue #%s ===\n' "$number"
            if (( SECONDS > 18 * 60 )); then
              printf '%s\n' 'Budget reached; remaining issues are left for the next run.'
              break
            fi
            printf '\n\n\n\n\n\n'

            title="$(gh issue view "$number" -R "$ISSUE_REPOSITORY" --json title --jq '.title')" || { echo "::warning::skip $number: view title failed" >&2; ((failed++)) || true; continue; }
            body="$(gh issue view "$number" -R "$ISSUE_REPOSITORY" --json body --jq '.body')" || { echo "::warning::skip $number: view body failed" >&2; ((failed++)) || true; continue; }
            prior_refinement=false
            if [[ "$body" == *'<!-- agent-refined: '* ]]; then
              prior_refinement=true
              body="$(printf '%s\n' "$body" | sed '/<!-- agent-refined: [^ ]* -->/d')"
            fi

            prompt="$RUNNER_TEMP/refine-prompt.txt"
            {
              printf '%s\n' 'Refine the following GitHub issue into clear, agent-ready text.'
              printf '%s\n' ''
              printf 'Issue #%s: %s\n' "$number" "$title"
              printf '%s\n' ''
              printf '%s\n' 'Current body:'
              printf '%s\n' "$body"
              comments="$RUNNER_TEMP/comments-${number}.txt"
              if [[ -s "$comments" ]] && [[ "$(jq 'length' "$comments")" -gt 0 ]]; then
                printf '\n%s\n' 'Reviewer comments (feedback to fold into the Goal and steps; do not quote them wholesale):'
                jq -r '.[] | "Author: \(.user.login)\nCreated at: \(.created_at)\nBody:\n\(.body)\n"' "$comments"
                if [[ "$prior_refinement" == true ]]; then
                  printf '%s\n' 'This is a prior refinement; the newest comments are new feedback that must be reflected in the output.'
                fi
              fi
              printf '%s\n' ''
              printf '%s\n' 'Your task: rewrite the issue body so that a coding agent can implement it'
              printf '%s\n' 'without ambiguity. The refined body MUST contain exactly two sections:'
              printf '%s\n' ''
              printf '%s\n' '## Goal'
              printf '%s\n' 'A single, precise sentence describing what the final state should be.'
              printf '%s\n' ''
              printf '%s\n' '## How to implement'
              printf '%s\n' 'Concrete steps, files to touch, and patterns to follow — enough for an'
              printf '%s\n' 'agent to start coding immediately.'
              printf '%s\n' ''
              printf '%s\n' 'Do NOT include any step to run ./scripts/completion-check,'
              printf '%s\n' 'AGENTS.md completion-check-command, or /completion-check-command'
              printf '%s\n' '— opencode enforces the AGENTS.md completion-check-command'
              printf '%s\n' 'automatically, so repeating it in the refined body is redundant.'
              printf '%s\n' ''
              printf '%s\n' 'Output ONLY the new issue body. No preamble, no markdown fences around'
              printf '%s\n' 'the whole output, no commentary.'
            } > "$prompt"

            out="$RUNNER_TEMP/refine-out-${number}.txt"
            for ((attempt = 1; attempt <= max_attempts; attempt++)); do
              if ((SECONDS > 18 * 60)); then
                printf '%s\n' 'Budget reached; remaining issues are left for the next run.'
                break
              fi

              set +e
              stop_token="$(openssl rand -hex 32)"
              : "${stop_token:?stop-commands fence token generation failed}"
              printf '::stop-commands::%s\n' "$stop_token"
              timeout 8m opencode run --agent issue-refiner --model "$selection_model" --title "issue-refiner" \
                "$(< "$prompt")" | tee "$out"
              statuses=("${PIPESTATUS[@]}")
              printf '::%s::\n' "$stop_token"
              opencode_status=${statuses[0]}
              tee_status=${statuses[1]}
              validation_out="$(python3 scripts/validate_refined_issue.py --file "$out" 2>&1)"
              validation_status=$?
              set -e

              if (( tee_status != 0 )); then
                printf 'Tee failed for issue #%s (tee=%s); skipping.\n' "$number" "$tee_status" >&2
                (( failed++ )) || true
                break
              fi
              if (( opencode_status != 0 )); then
                printf 'Refinement failed for issue #%s (opencode=%s); skipping.\n' "$number" "$opencode_status" >&2
                (( failed++ )) || true
                break
              fi
              if (( validation_status == 0 )); then
                printf '\n\n<!-- agent-refined: %s -->\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$out"
                gh issue edit "$number" --body-file "$out" -R "$ISSUE_REPOSITORY"
                gh issue edit "$number" --add-label "agent-refined" -R "$ISSUE_REPOSITORY"
                printf 'Issue #%s refined and labeled.\n' "$number"
                (( refined++ )) || true
                break
              fi

              reason="${validation_out##*REFINE_VALIDATION: }"
              case "$reason" in
                empty|missing_goal_heading|missing_impl_heading|empty_goal|empty_how_to_implement|wrong_order|extra_sections|fenced_output|hostile_text|too_long|ok) ;;
                *) reason='validator_unavailable' ;;
              esac
              printf 'Issue #%s attempt %s rejected: %s\n' "$number" "$attempt" "$reason"
              if (( attempt == max_attempts )); then
                printf 'Issue #%s not refined: %s\n' "$number" "$reason"
                (( failed++ )) || true
                break
              fi

              retry_prompt="$RUNNER_TEMP/refine-retry-prompt-${number}.txt"
              {
                cat "$prompt"
                printf '\nYour previous draft was rejected: reason=%s.\n' "$reason"
                printf '%s\n' ''
                printf '%s\n' 'The rejected draft was:'
                printf '%s\n' ''
                cat "$out"
                printf '\n\n'
                printf '%s\n' 'Output ONLY the corrected issue body with exactly these two sections:'
                printf '%s\n' ''
                printf '%s\n' '## Goal'
                printf '%s\n' 'A single, precise sentence describing what the final state should be.'
                printf '%s\n' ''
                printf '%s\n' '## How to implement'
                printf '%s\n' 'Concrete steps, files to touch, and patterns to follow — enough for an'
                printf '%s\n' 'agent to start coding immediately.'
              } > "$retry_prompt"
              prompt="$retry_prompt"
            done
          done < "$candidates"

          printf '\nRefinement complete: %s refined, %s failed.\n' "$refined" "$failed"
          (( refined > 0 )) || exit 1

      - name: Dump debug output
        if: always()
        shell: bash
        env:
          COORDINATOR_SESSION_TITLE: issue-refiner
        run: |
          python3 scripts/dump_subagent_transcripts.py || true
