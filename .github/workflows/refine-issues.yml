name: Refine issues

on:
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refine-issues.yml"
      - ".github/actions/**"
      - ".opencode/**"
      - "scripts/**"

permissions:
  contents: read
  issues: write

jobs:
  refine:
    runs-on: blacksmith-2vcpu-ubuntu-2404-arm
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
      OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      OPENCODE_GO_2_API_KEY: ${{ secrets.OPENCODE_GO_2_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
      OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
      ISSUE_REPOSITORY: ${{ vars.ISSUE_REPOSITORY || github.repository }}
      MODEL_AVAILABILITY_CACHE_ISSUE: ${{ vars.MODEL_AVAILABILITY_CACHE_ISSUE }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Set up OpenCode
        uses: ./.github/actions/setup-opencode

      - name: Warm up OpenCode CLI
        shell: bash
        run: scripts/wait_for_opencode.sh

      - name: Check model availability
        id: model-availability
        timeout-minutes: 10
        uses: ./.github/actions/model-availability

      - name: Refine issues
        id: refine
        uses: ./.github/actions/refine-issues
        with:
          available-models: ${{ steps.model-availability.outputs.available-models }}

      - name: Dump debug output
        if: always()
        shell: bash
        env:
          COORDINATOR_SESSION_TITLE: issue-refiner
        run: |
          python3 scripts/dump_subagent_transcripts.py || true
