name: Refresh ChatGPT auth

on:
  push:
    paths:
      - ".github/workflows/refresh-chatgpt-auth.yml"
      - "scripts/refresh-token.py"
  workflow_dispatch:
  schedule:
    # Twice a month (~half of the refresh token lifetime). The refresh step
    # rotates the token, so it never gets close to expiry.
    - cron: "0 0 1,15 * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      BACLUC_AGENT_GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Unit tests (chatgpt-login fallback)
        run: uv run --group dev pytest -q scripts/test_chatgpt_login.py

      - name: Install playwright browsers
        run: uv run playwright install --with-deps chrome

      - name: Try token refresh (no browser)
        id: refresh
        continue-on-error: true
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -Eeuo pipefail
          set +e
          uv run scripts/refresh-token.py > "$RUNNER_TEMP/auth.json" 2> "$RUNNER_TEMP/refresh-token.stderr"
          status=$?
          set -e
          if (( status == 0 )); then
            auth_json=$(cat "$RUNNER_TEMP/auth.json")
            [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
            printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' >/dev/null
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
            printf 'Auth candidate produced via refresh token, validating with opencode\n'
          else
            stop_token="$(openssl rand -hex 32)"
            : "${stop_token:?stop-commands fence token generation failed}"
            printf '::stop-commands::%s\n' "$stop_token"
            cat "$RUNNER_TEMP/refresh-token.stderr" >&2
            printf '::%s::\n' "$stop_token"
            printf 'Refresh token invalid, falling back to browser login\n'
          fi

      - name: Validate refreshed token with opencode
        id: validate
        continue-on-error: true
        if: steps.refresh.outputs.refreshed == 'true'
        env:
          OPENCODE_DISABLE_DEFAULT_PLUGINS: true
          OPENCODE_CONFIG_CONTENT: '{"plugin":[]}'
        run: |
          set -Eeuo pipefail
          npm install --global opencode-ai@1.18.32
          mkdir -p ~/.local/share/opencode
          cp "$RUNNER_TEMP/auth.json" ~/.local/share/opencode/auth.json
          set +e
          opencode run --model openai/gpt-5.6-luna "Respond with exactly OK." > "$RUNNER_TEMP/opencode-validate.log" 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            stop_token="$(openssl rand -hex 32)"
            : "${stop_token:?stop-commands fence token generation failed}"
            printf '::stop-commands::%s\n' "$stop_token"
            cat "$RUNNER_TEMP/opencode-validate.log"
            printf '::%s::\n' "$stop_token"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            printf 'Refreshed token rejected by opencode, falling back to browser login\n'
            exit 1
          else
            printf 'Refreshed token accepted by opencode\n'
          fi

      - name: Set secret (refreshed token)
        continue-on-error: true
        if: steps.refresh.outputs.refreshed == 'true' && steps.validate.outcome == 'success'
        run: |
          set -Eeuo pipefail
          auth_json=$(cat "$RUNNER_TEMP/auth.json")
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" --body "$auth_json"
          touch "$RUNNER_TEMP/refresh-chatgpt-auth.ok"
          printf 'Auth refreshed via refresh token\n'

      - name: Browser login (fallback)
        id: browser-login
        continue-on-error: true
        if: steps.refresh.outputs.refreshed != 'true' || steps.validate.outcome != 'success'
        env:
          OPENAI_USERNAME: ${{ secrets.OPENAI_USERNAME }}
          OPENAI_PASSWORD: ${{ secrets.OPENAI_PASSWORD }}
          OPENAI_2FA_KEY: ${{ secrets.OPENAI_2FA_KEY }}
        run: |
          set -Eeuo pipefail
          set +e
          xvfb-run -a uv run scripts/chatgpt-login.py > "$RUNNER_TEMP/auth.json" 2> "$RUNNER_TEMP/chatgpt-login.stderr"
          status=$?
          set -e
          if (( status != 0 )); then
            stop_token="$(openssl rand -hex 32)"
            : "${stop_token:?stop-commands fence token generation failed}"
            printf '::stop-commands::%s\n' "$stop_token"
            cat "$RUNNER_TEMP/auth.json" >&2
            cat "$RUNNER_TEMP/chatgpt-login.stderr" >&2
            printf '::%s::\n' "$stop_token"
            exit "$status"
          fi
          # xvfb-run merges the script's stderr into stdout, so drop the
          # [chatgpt-login] step-log lines before validating the JSON.
          auth_json=$(grep -v '^\[chatgpt-login\]' "$RUNNER_TEMP/auth.json")
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' >/dev/null
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" --body "$auth_json"
          touch "$RUNNER_TEMP/refresh-chatgpt-auth.ok"
          printf 'Auth refreshed via browser login\n'

      - name: Agent-usable primitives fallback (start/status/step)
        id: primitives
        continue-on-error: true
        timeout-minutes: 6
        if: ${{ !cancelled() && steps.browser-login.outcome == 'failure' }}
        env:
          OPENAI_USERNAME: ${{ secrets.OPENAI_USERNAME }}
          OPENAI_PASSWORD: ${{ secrets.OPENAI_PASSWORD }}
          OPENAI_2FA_KEY: ${{ secrets.OPENAI_2FA_KEY }}
        run: |
          set -Eeuo pipefail
          echo "Agent fallback: attempting login via primitives..."
          stop_token="$(openssl rand -hex 32)"
          : "${stop_token:?stop-commands fence token generation failed}"
          printf '::stop-commands::%s\n' "$stop_token"
          start_log="$RUNNER_TEMP/primitives-start.log"
          rm -f "$start_log"
          # start must run under a display (headful Chrome); it stays alive until
          # the OAuth callback fires, so background it with its own xvfb display.
          xvfb-run -a uv run scripts/chatgpt-login.py start > "$start_log" 2>&1 &
          start_pid=$!
          boot_deadline=$((SECONDS + 60))
          budget_deadline=$((SECONDS + 180))
          while kill -0 "$start_pid" 2>/dev/null; do
            if ((SECONDS >= budget_deadline)); then
              printf 'primitives: budget exhausted, aborting start\n'
              kill "$start_pid" 2>/dev/null || true
              break
            fi
            if ((SECONDS < boot_deadline)); then
              sleep 5
              continue
            fi
            status_json="$(uv run scripts/chatgpt-login.py status 2>/dev/null || true)"
            printf 'primitives status: %s\n' "$status_json"
            blocking="$(jq -r '.blocking // empty' <<<"$status_json" 2>/dev/null || true)"
            if [[ -n "$blocking" ]]; then
              printf 'primitives: blocked: %s\n' "$blocking"
            fi
            step_json="$(uv run scripts/chatgpt-login.py step 2>/dev/null || true)"
            printf 'primitives step: %s\n' "$step_json"
            if [[ "$(jq -r '.code_ready // false' <<<"$step_json" 2>/dev/null || true)" == "true" ]]; then
              break
            fi
            sleep 3
          done
          set +e
          wait "$start_pid"
          start_status=$?
          set -e
          printf 'primitives: start exited %s\n' "$start_status"
          # Dump the (untrusted) start log while the stop-commands fence is open.
          tail -n 40 "$start_log" >&2 || true
          printf '::%s::\n' "$stop_token"
          if (( start_status != 0 )); then
            printf '::error::primitives login did not complete\n'
            exit 1
          fi
          auth_json="$(cat "$HOME/.local/share/opencode/auth.json")"
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' >/dev/null
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" --body "$auth_json"
          touch "$RUNNER_TEMP/refresh-chatgpt-auth.ok"
          printf 'Auth refreshed via agent primitives\n'

      - name: Fail unless a path set the secret
        if: ${{ always() }}
        run: |
          set -Eeuo pipefail
          if [[ -f "$RUNNER_TEMP/refresh-chatgpt-auth.ok" ]]; then
            printf 'A credential path set OPENCODE_AUTH_JSON\n'
          else
            printf '::error::No path produced a usable OPENCODE_AUTH_JSON\n'
            exit 1
          fi
