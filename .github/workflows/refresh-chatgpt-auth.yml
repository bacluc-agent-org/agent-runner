name: Refresh ChatGPT auth

on:
  push:
    paths:
      - ".github/workflows/refresh-chatgpt-auth.yml"
      - "scripts/refresh-token.py"
      - "scripts/opencode_auth.py"
  workflow_dispatch:
  schedule:
    # Twice a month (~half of the refresh token lifetime). The refresh step
    # rotates the token, so it never gets close to expiry.
    - cron: "0 0 1,15 * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      BACLUC_AGENT_GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Try token refresh (no browser)
        id: refresh
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON_V1 }}
        run: |
          set -Eeuo pipefail
          umask 077
          set +e
          python3 scripts/refresh-token.py > "$RUNNER_TEMP/auth.json" 2> "$RUNNER_TEMP/refresh-token.stderr"
          status=$?
          set -e
          if (( status != 0 )); then
            printf '::error::OpenCode v1 token refresh failed; the dedicated secret was not changed.\n' >&2
            exit "$status"
          fi
          auth_json=$(cat "$RUNNER_TEMP/auth.json")
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' >/dev/null
          echo "refreshed=true" >> "$GITHUB_OUTPUT"
          printf 'Auth candidate produced via refresh token, validating with OpenCode v1\n'

      - name: Validate refreshed token with opencode
        id: validate
        if: steps.refresh.outputs.refreshed == 'true'
        run: |
          set -Eeuo pipefail
          umask 077
          npm install --global opencode-ai@1.18.32
          install -d -m 700 "$HOME/.local/share/opencode"
          install -m 600 "$RUNNER_TEMP/auth.json" "$HOME/.local/share/opencode/auth.json"
          set +e
          opencode --pure run --model openai/gpt-5.6-luna "Respond with exactly OK." > "$RUNNER_TEMP/opencode-validate.log" 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            printf '::error::OpenCode v1 rejected the refreshed credential; the dedicated secret was not changed.\n' >&2
            exit 1
          else
            printf 'Refreshed token accepted by opencode\n'
          fi

      - name: Set secret (refreshed token)
        if: steps.refresh.outputs.refreshed == 'true' && steps.validate.outcome == 'success'
        run: |
          set -Eeuo pipefail
          auth_json=$(cat "$RUNNER_TEMP/auth.json")
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          unset auth_json
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON_V1 --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/auth.json"
          printf 'Auth refreshed via refresh token\n'
