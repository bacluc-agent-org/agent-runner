name: Refresh ChatGPT auth

on:
  push:
    paths:
      - ".github/workflows/refresh-chatgpt-auth.yml"
      - "scripts/refresh-token.py"
      - "scripts/chatgpt-login.py"
      - "scripts/opencode_auth.py"
  workflow_dispatch:
    inputs:
      force_fallback:
        description: Skip the token-refresh path and exercise the browser/primitives fallbacks
        type: boolean
        default: false
      force_primitives:
        description: Skip refresh and browser login to exercise the primitives fallback
        type: boolean
        default: false
  schedule:
    # Twice a month (~half of the refresh token lifetime). The refresh step
    # rotates the token, so it never gets close to expiry.
    - cron: "0 0 1,15 * *"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      BACLUC_AGENT_GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Install playwright browsers
        run: uv run playwright install --with-deps chrome

      - name: Try token refresh (no browser)
        id: refresh
        if: ${{ !inputs.force_fallback && !inputs.force_primitives }}
        continue-on-error: true
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          set -Eeuo pipefail
          set +e
          uv run scripts/refresh-token.py > "$RUNNER_TEMP/auth.json" 2> "$RUNNER_TEMP/refresh-token.stderr"
          status=$?
          set -e
          if (( status == 0 )); then
            auth_json=$(cat "$RUNNER_TEMP/auth.json")
            [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
            printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' >/dev/null
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
            printf 'Auth candidate produced via refresh token, validating with opencode\n'
          else
            stop_token="$(openssl rand -hex 32)"
            : "${stop_token:?stop-commands fence token generation failed}"
            printf '::stop-commands::%s\n' "$stop_token"
            cat "$RUNNER_TEMP/refresh-token.stderr" >&2
            printf '::%s::\n' "$stop_token"
            printf 'Refresh token invalid, falling back to browser login\n'
          fi

      - name: Validate refreshed token with opencode
        id: validate
        if: steps.refresh.outputs.refreshed == 'true'
        run: |
          set -Eeuo pipefail
          npm install --global opencode-ai@1.18.32
          mkdir -p ~/.local/share/opencode
          cp "$RUNNER_TEMP/auth.json" ~/.local/share/opencode/auth.json
          set +e
          opencode --pure run --model openai/gpt-5.6-luna "Respond with exactly OK." > "$RUNNER_TEMP/opencode-validate.log" 2>&1
          status=$?
          set -e
          if (( status != 0 )); then
            stop_token="$(openssl rand -hex 32)"
            : "${stop_token:?stop-commands fence token generation failed}"
            printf '::stop-commands::%s\n' "$stop_token"
            cat "$RUNNER_TEMP/opencode-validate.log"
            printf '::%s::\n' "$stop_token"
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            printf 'Refreshed token rejected by opencode, falling back to browser login\n'
            exit 1
          else
            printf 'Refreshed token accepted by opencode\n'
          fi

      - name: Set secret (refreshed token)
        if: steps.refresh.outputs.refreshed == 'true' && steps.validate.outcome == 'success'
        run: |
          set -Eeuo pipefail
          auth_json=$(cat "$RUNNER_TEMP/auth.json")
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" --body "$auth_json"
          printf 'Auth refreshed via refresh token\n'

      - name: Browser login (fallback)
        id: browser-login
        if: ${{ !cancelled() && !inputs.force_primitives && (steps.refresh.outputs.refreshed != 'true' || steps.validate.outcome != 'success') }}
        env:
          OPENAI_USERNAME: ${{ secrets.OPENAI_USERNAME }}
          OPENAI_PASSWORD: ${{ secrets.OPENAI_PASSWORD }}
          OPENAI_2FA_KEY: ${{ secrets.OPENAI_2FA_KEY }}
        run: |
          set -Eeuo pipefail
          set +e
          xvfb-run -a uv run scripts/chatgpt-login.py > "$RUNNER_TEMP/auth.json" 2> "$RUNNER_TEMP/chatgpt-login.stderr"
          status=$?
          set -e
          if (( status != 0 )); then
            printf 'Browser login failed; authentication output suppressed.\n' >&2
            exit "$status"
          fi
          # xvfb-run merges the script's stderr into stdout, so drop the
          # [chatgpt-login] step-log lines before validating the JSON.
          auth_json=$(grep -v '^\[chatgpt-login\]' "$RUNNER_TEMP/auth.json")
          [[ -n "${auth_json:-}" ]] && printf '::add-mask::%s\n' "$auth_json"
          printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and .openai.access != "" and .openai.refresh != "" and (.openai.expires | type == "number")' >/dev/null
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" --body "$auth_json"
          printf 'Auth refreshed via browser login\n'

      - name: Agent-usable primitives fallback (start/status/step)
        if: ${{ !cancelled() && (inputs.force_primitives || steps.browser-login.outcome == 'failure') }}
        env:
          CHATGPT_EMAIL: ${{ secrets.CHATGPT_EMAIL || secrets.OPENAI_USERNAME }}
          CHATGPT_PASSWORD: ${{ secrets.CHATGPT_PASSWORD || secrets.OPENAI_PASSWORD }}
          CHATGPT_2FA_KEY: ${{ secrets.CHATGPT_2FA_KEY || secrets.OPENAI_2FA_KEY }}
          OPENAI_USERNAME: ${{ secrets.OPENAI_USERNAME }}
          OPENAI_PASSWORD: ${{ secrets.OPENAI_PASSWORD }}
          OPENAI_2FA_KEY: ${{ secrets.OPENAI_2FA_KEY }}
          CHATGPT_TOTP_KEY: ${{ secrets.CHATGPT_TOTP_KEY }}
          CHATGPT_HEADLESS: "true"
        run: |
          set -Eeuo pipefail
          echo "Agent fallback: attempting login via primitives..."
          stop_token="$(openssl rand -hex 32)"
          : "${stop_token:?stop-commands fence token generation failed}"
          printf '::stop-commands::%s\n' "$stop_token"
          uv run scripts/chatgpt-login.py start > "$RUNNER_TEMP/primitives-auth.json" 2> "$RUNNER_TEMP/primitives-login.stderr" &
          login_pid=$!
          cleanup() {
            if kill -0 "$login_pid" 2>/dev/null; then
              kill "$login_pid" 2>/dev/null || true
              wait "$login_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          completed=false
          for attempt in $(seq 1 60); do
            if ! kill -0 "$login_pid" 2>/dev/null; then
              if ! wait "$login_pid"; then
                printf 'Primitive login startup failed; safe diagnostics:\n' >&2
                cat "$RUNNER_TEMP/primitives-login.stderr" >&2
                exit 1
              fi
              completed=true
              break
            fi
            if [[ -s "$RUNNER_TEMP/primitives-auth.json" ]]; then
              if ! wait "$login_pid"; then
                printf 'Primitive login startup failed; safe diagnostics:\n' >&2
                cat "$RUNNER_TEMP/primitives-login.stderr" >&2
                exit 1
              fi
              completed=true
              break
            fi
            if ! status_json=$(uv run scripts/chatgpt-login.py status); then
              sleep 5
              continue
            fi
            printf '%s\n' "$status_json" | jq -e 'type == "object" and (.error == null) and (.step | type == "string") and ((.blocking == null) or (.blocking | type == "string"))' >/dev/null || { printf 'Primitive login reported an invalid status\n' >&2; exit 1; }
            if [[ "$(jq -r '.blocking // empty' <<< "$status_json")" != "" ]]; then
              printf 'Primitive login reports a blocking page; retrying the step until it clears\n' >&2
            fi
            if [[ "$(jq -r '.code_ready' <<< "$status_json")" == true ]]; then
              wait "$login_pid" || { printf 'Primitive login start failed; output suppressed\n' >&2; exit 1; }
              completed=true
              break
            fi
            step_json=$(uv run scripts/chatgpt-login.py step) || step_status=$?
            if [[ -n "${step_status:-}" ]]; then
              [[ "$step_status" == 1 || "$step_status" == 2 ]] || { printf 'Primitive login step failed with status %s\n' "$step_status" >&2; exit "$step_status"; }
              unset step_status
            else
              printf '%s\n' "$step_json" | jq -e 'type == "object" and (.error == null) and (.step | type == "string") and ((.blocking == null) or (.blocking | type == "string"))' >/dev/null || { printf 'Primitive login step returned an invalid status\n' >&2; exit 1; }
              if [[ "$(jq -r '.blocking // empty' <<< "$step_json")" != "" ]]; then
                sleep 5
                continue
              fi
            fi
            sleep 5
          done
          [[ "$completed" == true ]] || { printf 'Primitive login timed out after %s attempts\n' "$attempt" >&2; exit 1; }
          auth_json=$(cat "$RUNNER_TEMP/primitives-auth.json")
          [[ -n "$auth_json" ]] || { printf 'Primitive login produced no authentication JSON\n' >&2; exit 1; }
          printf '::%s::\n' "$stop_token"
          printf '::add-mask::%s\n' "$auth_json"
          stop_token="$(openssl rand -hex 32)"
          : "${stop_token:?stop-commands fence token generation failed}"
          printf '::stop-commands::%s\n' "$stop_token"
          printf '%s\n' "$auth_json" | jq -e '.openai.type == "oauth" and (.openai.access | type == "string" and length > 0) and (.openai.refresh | type == "string" and length > 0) and (.openai.expires | type == "number")' >/dev/null
          GH_TOKEN="$BACLUC_AGENT_GITHUB_TOKEN" gh secret set OPENCODE_AUTH_JSON --repo "$GITHUB_REPOSITORY" --body "$auth_json"
          printf '::%s::\n' "$stop_token"
          printf 'Auth refreshed via primitives fallback\n'
