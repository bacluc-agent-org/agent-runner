name: Renovate reformat

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reformat:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Reformat working tree
        run: ./scripts/prettier --write .

      - name: Commit and push reformat
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            printf '%s\n' 'No formatting changes to commit.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: reformat after Renovate update"
          git push origin "HEAD:${TARGET_BRANCH}"
