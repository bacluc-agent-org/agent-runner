name: Review fixes runner

on:
  schedule:
    - cron: "32 */4 * * *" # Every 4 hours at :32
  workflow_dispatch:
    inputs:
      prompt:
        description: >-
          Optional override prompt for all PRs (leave empty for
          auto-generation).
        required: false
        type: string
      model:
        description: Optional OpenCode model override (e.g. opencode-go-openai/glm-5.2)
        required: false
        type: string
  push:
    paths:
      - ".github/workflows/review-fixes.yml"
      - ".github/workflows/opencode.yml"
      - ".github/actions/**"
      - ".opencode/**"
      - "scripts/**"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Find all open PRs with review comments from @Bacluc or @bacluc-agent
  # ---------------------------------------------------------------------------
  find-prs:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    outputs:
      prs: ${{ steps.find.outputs.prs }}
      count: ${{ steps.find.outputs.count }}
      pr_metadata: ${{ steps.find.outputs.pr_metadata }}
    steps:
      - name: Check out runner repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}

      - name: Find PRs with review comments
        id: find
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.BACLUC_AGENT_GITHUB_TOKEN }}
          OVERRIDE_PROMPT: ${{ inputs.prompt }}
          SEARCH_OWNER: ${{ vars.REVIEW_FIXES_OWNER || github.repository_owner }}
        run: |
          set -Eeuo pipefail
          printf '::add-mask::%s\n' "$GITHUB_TOKEN"

          prs_file="$RUNNER_TEMP/prs.json"

          declare -A seen

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            seen[$pr]=1
          done < <(
            gh api --paginate \
              "search/issues?q=is:pr+is:open+org:${SEARCH_OWNER}+reviewed-by:Bacluc+-label:\"agents-ignore\"&per_page=100" \
              --jq '.items[] | "\(.repository_url | sub("https://api.github.com/repos/"; ""))#\(.number)"' 2>/dev/null || true
          )

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            seen[$pr]=1
          done < <(
            gh api --paginate \
              "search/issues?q=is:pr+is:open+org:${SEARCH_OWNER}+reviewed-by:bacluc-agent+-label:\"agents-ignore\"&per_page=100" \
              --jq '.items[] | "\(.repository_url | sub("https://api.github.com/repos/"; ""))#\(.number)"' 2>/dev/null || true
          )

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            seen[$pr]=1
          done < <(
            gh api --paginate \
              "search/issues?q=is:pr+is:open+author:${SEARCH_OWNER}+reviewed-by:Bacluc+-label:\"agents-ignore\"&per_page=100" \
              --jq '.items[] | "\(.repository_url | sub("https://api.github.com/repos/"; ""))#\(.number)"' 2>/dev/null || true
          )

          while IFS= read -r pr; do
            [[ -n "$pr" ]] || continue
            seen[$pr]=1
          done < <(
            gh api --paginate \
              "search/issues?q=is:pr+is:open+author:${SEARCH_OWNER}+reviewed-by:${SEARCH_OWNER}+-label:\"agents-ignore\"&per_page=100" \
              --jq '.items[] | "\(.repository_url | sub("https://api.github.com/repos/"; ""))#\(.number)"' 2>/dev/null || true
          )

          mapfile -t unique_prs < <(printf '%s\n' "${!seen[@]}" | sort -t'#' -k2,2n)

          if [[ ${#unique_prs[@]} -eq 0 || -z "${unique_prs[0]}" ]]; then
            printf '%s\n' 'No open PRs with review comments found.'
            {
              echo "prs<<PRS_EOF"
              echo "[]"
              echo "PRS_EOF"
              echo "count=0"
              echo "pr_metadata<<META_EOF"
              echo "{}"
              echo "META_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            unique_prs=("${unique_prs[0]}")
          fi

          printf 'Found %d open PR(s) with review comments: %s\n' \
            "${#unique_prs[@]}" "${unique_prs[*]}"

          viewed_prs=()
          pr_metadata="{}"
          for pr_key in "${unique_prs[@]}"; do
            repo="${pr_key%#*}"
            pr_number="${pr_key##*#}"
            pr_info=$(gh pr view "$pr_number" -R "$repo" --json number,title,headRefName,url 2>/dev/null) || {
              printf 'Skipping PR %s: gh pr view failed\n' "$pr_key" >&2
              continue
            }
            viewed_prs+=("$pr_key")
            if [[ -n "${OVERRIDE_PROMPT:-}" ]]; then
              prompt="$OVERRIDE_PROMPT"
            else
              title=$(jq -r '.title' <<<"$pr_info")
              head_ref=$(jq -r '.headRefName' <<<"$pr_info")
              url=$(jq -r '.url' <<<"$pr_info")
              prompt=$(printf '%s\n' \
                "PR #${pr_number}: ${title}" \
                "Branch: ${head_ref}" \
                "URL: ${url}" \
                "" \
                "Apply the review comments for this PR. Check the PR review comments," \
                "implement the requested changes, push to the PR branch, and verify" \
                "the changes work. Update the existing comment containing <!-- agent-progress --> on the corresponding issue instead of posting new comments.")
            fi
            pr_info=$(jq --arg prompt "$prompt" '. + {prompt: $prompt}' <<<"$pr_info")
            pr_metadata=$(jq --argjson pr "$pr_info" --arg key "$pr_key" --arg repo "$repo" \
              '. + {($key): ($pr + {repository: $repo})}' <<<"$pr_metadata")
          done

          if [[ ${#viewed_prs[@]} -eq 0 ]]; then
            printf '%s\n' 'No viewable open PRs with review comments found.'
            {
              echo "prs<<PRS_EOF"
              echo "[]"
              echo "PRS_EOF"
              echo "count=0"
              echo "pr_metadata<<META_EOF"
              echo "{}"
              echo "META_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "${viewed_prs[@]}" | jq -R . | jq -s . > "$prs_file"

          {
            echo "prs<<PRS_EOF"
            cat "$prs_file"
            echo "PRS_EOF"
            echo "count=${#viewed_prs[@]}"
            echo "pr_metadata<<META_EOF"
            echo "$pr_metadata"
            echo "META_EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: Process each PR — dispatch to opencode workflow (matrix)
  # ---------------------------------------------------------------------------
  process-prs:
    needs: find-prs
    if: needs.find-prs.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.find-prs.outputs.prs) }}
    uses: ./.github/workflows/opencode.yml
    with:
      prompt: ${{ fromJson(needs.find-prs.outputs.pr_metadata)[matrix.pr].prompt }}
      model: ${{ inputs.model }}
    secrets: inherit
