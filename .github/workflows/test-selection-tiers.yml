name: selection tiers tests

on:
  push:
    paths:
      - scripts/issue-selection-tail.txt
      - scripts/test_selection_tiers.py
      - .github/workflows/test-selection-tiers.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        run: pip install --quiet uv

      - name: Run selection tiers tests
        run: uv run --group dev pytest -q scripts/test_selection_tiers.py
