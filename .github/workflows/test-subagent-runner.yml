name: Test subagent runner

on:
  push:
    paths:
      - scripts/subagent_runner.py
      - scripts/test_subagent_runner.py
      - .github/workflows/test-subagent-runner.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Run subagent runner tests
        run: uv run --group dev pytest -q scripts/test_subagent_runner.py
